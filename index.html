<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="board" id="board">
    <svg class="traces" id="traces" aria-hidden="true" focusable="false"></svg>
    <i class="mount tl" aria-hidden="true"></i><i class="mount tr" aria-hidden="true"></i>
    <i class="mount bl" aria-hidden="true"></i><i class="mount br" aria-hidden="true"></i>

    <header class="titleblock" id="titleblock"></header>

    <main class="stage" id="main">
      <div class="grid" id="view-board"></div>
      <article class="post" id="view-post" hidden></article>
    </main>

    <footer class="foot" id="foot"></footer>
    <div class="fingers" aria-hidden="true"></div>
  </div>

  <noscript><p style="color:#eef3ea;font-family:monospace;text-align:center;padding:2em">This site needs JavaScript to draw the board.</p></noscript>

  <script src="config.js"></script>
